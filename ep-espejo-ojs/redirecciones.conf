# Mantiene vivas las URL antiguas (ID numéricos) después de pasar a OJS 3.5,
# que interpreta los números como ID internos.
<Directory /var/www/html>
  RewriteEngine On
  RewriteRule ^index\.php/cep/(?:(es|en)/)?issue/view/([0-9]+)(/.*)?$ /index.php/cep/es/issue/view/numero-$2$3 [R=301,L]
  RewriteRule ^index\.php/cep/(?:(es|en)/)?article/(view|download)/([0-9]+)/([0-9]+)(/.*)?$ /index.php/cep/es/article/$2/articulo-$3/g-$4$5 [R=301,L]
  RewriteRule ^index\.php/cep/(?:(es|en)/)?article/view/([0-9]+)/?$ /index.php/cep/es/article/view/articulo-$2 [R=301,L]
</Directory>

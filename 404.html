<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Fabián Belmar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#f2f2f0;--text:#232322;--muted:#6f6f6b;--line:#b4b4af;--perf:#2b2b29}
[data-theme="dark"]{--bg:#1f1f1e;--text:#ecece8;--muted:#a2a29d;--line:#555551;--perf:#c9c9c4}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
main{max-width:560px;margin:18vh auto 0;padding:0 16px;position:relative}
.perf{position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;opacity:.35;z-index:0;
 background-image:radial-gradient(circle,var(--perf) 2.2px,transparent 2.6px);background-size:12px 12px}
h1,p,a{position:relative;z-index:1}
h1{font-size:2rem;font-weight:700;letter-spacing:-.035em;margin:0 0 .6rem}
p{color:var(--muted);line-height:1.5;margin:0 0 1.4rem}
a{display:inline-block;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.45rem 1.1rem}
a:hover{border-color:var(--text)}
</style>
</head>
<body>
<main>
<div class="perf" aria-hidden="true"></div>
<h1>Página no encontrada</h1>
<p>La dirección que buscas no existe o cambió de lugar.</p>
<a href="/">Volver al inicio</a>
</main>
</body>
</html>
